services:
  db:
    build:
      context: .
      dockerfile: docker/init/Dockerfile
    container_name: poli-redi-db
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD:?Define MSSQL_SA_PASSWORD in the root .env file}"
      MSSQL_PID: "Developer"
      DB_NAME: "${MSSQL_DB_NAME:-poli-redi-database}"
      DB_USER: "${MSSQL_DB_USER:-poli-redi-admin}"
    ports:
      - "${MSSQL_PORT:-1433}:1433"
    volumes:
      - poli-redi-mssql:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$${MSSQL_SA_PASSWORD}\" -C -Q \"SELECT 1\" -b -o /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 60s

volumes:
  poli-redi-mssql:
